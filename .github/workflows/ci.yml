name: TorqueLock AR CI - Acceptance & LEAF Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js Test Suite (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Verify Release and Preview Assets
        run: node scripts/verify-assets.cjs

      - name: Run TorqueLock AR Acceptance Tests
        run: npm test
